<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" fill="none">
  <!-- Diary/Book with lock -->
  <rect x="45" y="30" width="110" height="130" rx="8" fill="#F2EDE4" stroke="#1B2A4A" stroke-width="2.5"/>
  <!-- Book spine -->
  <rect x="45" y="30" width="16" height="130" rx="4" fill="#E8A838" stroke="#1B2A4A" stroke-width="2"/>
  <!-- Page lines -->
  <line x1="76" y1="60" x2="138" y2="60" stroke="#D5CEC5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="76" y1="76" x2="138" y2="76" stroke="#D5CEC5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="76" y1="92" x2="120" y2="92" stroke="#D5CEC5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="76" y1="108" x2="132" y2="108" stroke="#D5CEC5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="76" y1="124" x2="110" y2="124" stroke="#D5CEC5" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Lock circle -->
  <circle cx="140" cy="145" r="22" fill="#fff" stroke="#1B2A4A" stroke-width="2.5"/>
  <!-- Lock shackle -->
  <path d="M130 145 V136 a10 10 0 0 1 20 0 V145" fill="none" stroke="#1B2A4A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lock body -->
  <rect x="127" y="145" width="26" height="18" rx="3" fill="#E8A838" stroke="#1B2A4A" stroke-width="2"/>
  <!-- Keyhole -->
  <circle cx="140" cy="152" r="3" fill="#1B2A4A"/>
  <rect x="138.5" y="154" width="3" height="5" rx="1" fill="#1B2A4A"/>
  <!-- Eye with slash (privacy) -->
  <g transform="translate(80, 14)">
    <path d="M0 10 Q15 -2 30 10 Q15 22 0 10Z" fill="none" stroke="#7D9B76" stroke-width="2" stroke-linecap="round"/>
    <circle cx="15" cy="10" r="4" fill="none" stroke="#7D9B76" stroke-width="2"/>
    <line x1="3" y1="18" x2="27" y2="2" stroke="#D4654A" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
