<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <pattern id="stationeryPattern" x="0" y="0" width="300" height="300" patternUnits="userSpaceOnUse">
      <!-- Background -->
      <rect width="300" height="300" fill="#faf7f2"/>
      
      <!-- Pencil 1 -->
      <g transform="translate(50, 60) rotate(30)" fill="#3b82f6" opacity="0.4">
        <rect x="0" y="4" width="40" height="8" fill="#3b82f6"/>
        <polygon points="40,4 48,8 40,12" fill="#1e40af"/>
        <rect x="48" y="6" width="4" height="4" fill="#1e3a8a"/>
      </g>
      
      <!-- Scissors -->
      <g transform="translate(150, 50)" fill="#2563eb" opacity="0.4">
        <circle cx="8" cy="8" r="6" fill="none" stroke="#2563eb" stroke-width="2"/>
        <circle cx="8" cy="22" r="6" fill="none" stroke="#2563eb" stroke-width="2"/>
        <path d="M14 8 L28 22 M14 22 L28 8" stroke="#2563eb" stroke-width="2" fill="none"/>
      </g>
      
      <!-- Eraser -->
      <g transform="translate(220, 80)" fill="#1d4ed8" opacity="0.3">
        <rect x="0" y="0" width="20" height="12" rx="2" fill="#1d4ed8"/>
        <rect x="20" y="2" width="15" height="8" rx="1" fill="#1e40af"/>
      </g>
      
      <!-- Ruler -->
      <g transform="translate(40, 150)" fill="#1e40af" opacity="0.4">
        <rect x="0" y="0" width="60" height="8" fill="#1e40af"/>
        <line x1="10" y1="0" x2="10" y2="4" stroke="white" stroke-width="1"/>
        <line x1="20" y1="0" x2="20" y2="4" stroke="white" stroke-width="1"/>
        <line x1="30" y1="0" x2="30" y2="4" stroke="white" stroke-width="1"/>
        <line x1="40" y1="0" x2="40" y2="4" stroke="white" stroke-width="1"/>
        <line x1="50" y1="0" x2="50" y2="4" stroke="white" stroke-width="1"/>
      </g>
      
      <!-- Paint palette -->
      <g transform="translate(180, 120)" fill="#2563eb" opacity="0.3">
        <ellipse cx="20" cy="15" rx="18" ry="12" fill="#e5e7eb"/>
        <circle cx="12" cy="12" r="4" fill="#1e40af"/>
        <circle cx="20" cy="10" r="4" fill="#3b82f6"/>
        <circle cx="28" cy="13" r="4" fill="#2563eb"/>
        <circle cx="15" cy="18" r="4" fill="#1d4ed8"/>
        <circle cx="25" cy="20" r="4" fill="#1e3a8a"/>
      </g>
      
      <!-- Pencil 2 -->
      <g transform="translate(120, 200) rotate(-45)" fill="#1e40af" opacity="0.4">
        <rect x="0" y="4" width="35" height="6" fill="#1e40af"/>
        <polygon points="35,4 42,7 35,10" fill="#1e3a8a"/>
        <rect x="42" y="6" width="3" height="2" fill="#1e3a8a"/>
      </g>
      
      <!-- Paper clip -->
      <g transform="translate(80, 230)" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.4">
        <path d="M4 4 L4 16 Q4 22 10 22 Q16 22 16 16 L16 8"/>
      </g>
      
      <!-- Push pin -->
      <g transform="translate(250, 160)" fill="#1d4ed8" opacity="0.4">
        <circle cx="6" cy="6" r="4" fill="#1d4ed8"/>
        <line x1="6" y1="10" x2="6" y2="16" stroke="#1d4ed8" stroke-width="2"/>
      </g>
      
      <!-- Glue bottle -->
      <g transform="translate(200, 220)" fill="#2563eb" opacity="0.3">
        <rect x="6" y="12" width="12" height="18" rx="1" fill="#2563eb"/>
        <rect x="8" y="6" width="8" height="8" fill="#2563eb"/>
        <rect x="10" y="2" width="4" height="6" fill="#2563eb"/>
      </g>
      
      <!-- Small dots and elements -->
      <circle cx="60" cy="120" r="2" fill="#3b82f6" opacity="0.3"/>
      <circle cx="270" cy="90" r="2" fill="#3b82f6" opacity="0.3"/>
      <circle cx="30" cy="250" r="2" fill="#3b82f6" opacity="0.3"/>
      <circle cx="180" cy="280" r="2" fill="#3b82f6" opacity="0.3"/>
      
      <!-- Triangle elements -->
      <polygon points="280,30 285,20 290,30" fill="#1e40af" opacity="0.3"/>
      <polygon points="20,180 25,170 30,180" fill="#2563eb" opacity="0.3"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#stationeryPattern)"/>
</svg>